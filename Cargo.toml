[package]
name = "frot"
version = "0.0.0"
edition = "2021"
description = "Take an impression of a web page — structure, text, accessibility tree — without rendering or executing it."
repository = "https://github.com/mudbungie/frot"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "frot"
path = "src/lib.rs"

[[bin]]
name = "frot"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
html5ever = "0.39"
markup5ever_rcdom = "0.39"
url = "2"
# HTTP/1.1 client: ureq keeps redirects, gzip/brotli, timeouts and the error
# taxonomy. Its own rustls feature is dropped — the TLS handshake is supplied
# by `craftls` behind `src/fetch/firefox_tls.rs` so the ClientHello matches
# Firefox (WAF fingerprint match). ureq speaks HTTP/1.1 only.
ureq = { version = "3", default-features = false, features = ["gzip", "brotli"] }
# `craftls` = a fork of rustls with a craftable ClientHello (cipher/extension
# order, GREASE, key-share, padding). NB (corrected 2026-07-20): `ring` is NOT
# pure Rust — it carries 17 C files + 90 pregenerated asm files (BoringSSL-
# derived). To be retired for `rustls 0.23 + aws-lc-rs` (Mark's call, 2026-07-20;
# a C+asm -> C+asm move, not pure-Rust -> C), see docs/design/identity.md §6.1.
# Kept behind `firefox_tls.rs`; no craftls type leaks past that module. See
# bl-0eba journal for the maintenance tradeoff.
craftls = { version = "0.0.2", package = "craftls", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"
rustls-pki-types = "1"
encoding_rs = "0.8"
# --js engine (Phase 4). Vendored quickjs-ng C compiled by `cc` with
# pregenerated bindings — no bindgen, no cmake, no system dep. Kept behind
# `src/js/engine.rs`; no rquickjs type leaks past that module.
rquickjs = { version = "0.12", default-features = false, features = ["loader"] }

[dev-dependencies]
mockito = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
