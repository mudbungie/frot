[package]
name = "frot"
version = "0.0.0"
edition = "2021"
description = "Take an impression of a web page — structure, text, accessibility tree — without rendering or executing it."
repository = "https://github.com/mudbungie/frot"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "frot"
path = "src/lib.rs"

[[bin]]
name = "frot"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
html5ever = "0.39"
markup5ever_rcdom = "0.39"
url = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "brotli"] }
encoding_rs = "0.8"
# --js engine (Phase 4). Vendored quickjs-ng C compiled by `cc` with
# pregenerated bindings — no bindgen, no cmake, no system dep. Kept behind
# `src/js/engine.rs`; no rquickjs type leaks past that module.
rquickjs = { version = "0.12", default-features = false }

[dev-dependencies]
mockito = "1"
rustls = { version = "0.23", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
