[package]
name = "frot"
version = "0.0.0"
edition = "2021"
description = "Take an impression of a web page — structure, text, accessibility tree — without rendering or executing it."
repository = "https://github.com/mudbungie/frot"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "frot"
path = "src/lib.rs"

[[bin]]
name = "frot"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
html5ever = "0.39"
markup5ever_rcdom = "0.39"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
