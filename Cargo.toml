[package]
name = "frot"
version = "0.0.1"
edition = "2021"
# The tagline's single authoritative home (rendered as the crates.io headline).
# README.md repeats it verbatim; tests/binary.rs pins the match so they cannot
# drift. It compresses VISION.md's scope and non-goals: capabilities (--css,
# --js) are opt-in, and interaction ("driving") is a permanent non-goal.
description = "Take an impression of a web page — structure, text, accessibility tree — running its scripts only when you ask, and never driving it."
repository = "https://github.com/mudbungie/frot"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["html", "dom", "scraping", "accessibility", "cli"]
categories = ["command-line-utilities", "web-programming", "parser-implementations", "accessibility"]
# MSRV = the pinned toolchain (rust-toolchain.toml `channel = "1.95.0"`): 1.95 is
# the only compiler this repo ever builds or tests with, so it is the only floor
# we can honestly assert. Lower it only with a build on that older toolchain.
rust-version = "1.95"
# tests/fixtures/ is excluded: ~1.7M of vendored third-party bundles and
# deployed pages (jquery/react/vue/TodoMVC/…), read only by `#[cfg(test)]`
# modules — never by a build of the lib or bin. Shipping them would redistribute
# other people's content forever under *this* crate's license and multiply the
# download. Tests run from the git checkout, which is what CI does.
#
# The exclusion is not the whole answer, because the git checkout is itself
# distributed: every file under tests/fixtures/ carries its own upstream
# license, mapped file-by-file in tests/fixtures/NOTICE.md with the texts
# vendored in tests/fixtures/licenses/. Fixtures that only need a *shape*
# (tests/fixtures/needs/) are synthetic instead, so nothing third-party is
# redistributed for them at all.
exclude = ["tests/fixtures/"]

[lib]
name = "frot"
path = "src/lib.rs"

[[bin]]
name = "frot"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
html5ever = "0.39"
markup5ever_rcdom = "0.39"
url = "2"
# HTTP transport (Stage B): hyper speaks both HTTP/1.1 and HTTP/2 and selects by
# ALPN, so a Firefox-shaped ClientHello can honestly negotiate h2 and multiplex
# through the one per-invocation session (identity.md §7). Redirects, gzip/brotli
# decode, the error taxonomy and body/deadline caps are reimplemented on top of
# it behind the fetch seam. Driven by a per-invocation tokio runtime + block_on:
# the public fetch API stays blocking and no runtime outlives the invocation.
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "time"] }
flate2 = "1"
brotli = { version = "8", default-features = false, features = ["std"] }
# TLS: stock `rustls 0.23` + `aws-lc-rs` (Mark's Option-C ruling, 2026-07-21;
# identity.md §6.1). Retires the abandoned `craftls` fork (a dead fork of rustls
# 0.22 — §6.3), so rustls CVEs now reach frot by `cargo update`. Stock rustls
# emits its own ClientHello order/set: the divergence from Firefox is a *declared
# residual* in the §12 oracle, not a crafted match. Kept behind `firefox_tls.rs`;
# no rustls handshake type leaks past that module.
rustls = "0.23"
webpki-roots = "0.26"
rustls-pki-types = "1"
encoding_rs = "0.8"
# --js engine (Phase 4). Vendored quickjs-ng C compiled by `cc` with
# pregenerated bindings — no bindgen, no cmake, no system dep. Kept behind
# `src/js/engine.rs`; no rquickjs type leaks past that module.
rquickjs = { version = "0.12", default-features = false, features = ["loader"] }
# `CLOCK_THREAD_CPUTIME_ID` for the §5 compute budget (js.md §5, bl-8dc0): the
# unit of frot's own work is CPU time, and `std` exposes no process/thread CPU
# clock. Already in the tree transitively under tokio/rustls, so a direct
# dependency adds no binary and no new transitive; the one use is
# `src/js/engine/clock.rs`.
libc = "0.2"

[dev-dependencies]
mockito = "1"
# Local h1/h2 TLS servers for the transport oracle: hyper's auto server behind
# tokio-rustls with the throwaway CA proves ALPN-selected h2 and h1 fallback
# complete with certificate verification on.
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
http-body-util = "0.1"
rustls-pki-types = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
