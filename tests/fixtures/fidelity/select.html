<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select modes</title>
</head>
<body>
<h1>Select modes</h1>
<p>A menu list paints only its own box; a list box lays its options out.</p>
<p><select aria-label="plain"><option>p1</option><option>p2</option></select></p>
<p><select aria-label="size one" size="1"><option>s1</option></select></p>
<p><select aria-label="size zero" size="0"><option>z1</option></select></p>
<p><select aria-label="size word" size="x"><option>w1</option></select></p>
<p><select aria-label="size negative" size="-2"><option>n1</option></select></p>
<p><select aria-label="size fraction" size="1.5"><option>f1</option></select></p>
<p><select aria-label="multiple size one" multiple size="1"><option>m1</option><option>m2</option></select></p>
<p><select aria-label="grouped menu"><optgroup label="G"><option>g1</option></optgroup><option>g2</option></select></p>
<p><select aria-label="size two" size="2"><option>t1</option><option>t2</option></select></p>
<p><select aria-label="size padded" size=" 4 "><option>d1</option></select></p>
<p><select aria-label="size plus" size="+3"><option>u1</option></select></p>
<p><select aria-label="size junk" size="2abc"><option>j1</option></select></p>
<p><select aria-label="multiple" multiple><option>l1</option><option>l2</option></select></p>
<p><select aria-label="multiple size zero" multiple size="0"><option>y1</option></select></p>
<p><select aria-label="grouped list" size="3"><optgroup label="H"><option>h1</option></optgroup><option hidden>h2</option><option>h3</option></select></p>
<p><select aria-label="hidden in a menu"><option hidden>q1</option><option style="display:none">q2</option><option style="visibility:hidden">q3</option><option>q4</option></select></p>
<p><select aria-label="hidden list" size="3" style="visibility:hidden"><option>r1</option></select></p>
</body>
</html>
