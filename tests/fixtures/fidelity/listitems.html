<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>List items by display</title>
</head>
<body>
<div><li>outside a list</li></div>
<p><button>r1<span style="display:inline list-item">r2</span>r3</button></p>
<div style="display:list-item">block item</div>
<p>q <span style="display:inline list-item">il</span> q</p>
<p>q <span style="display:inline list-item"></span> q</p>
<p>q <b style="display:inline list-item">bil</b> q</p>
<p>q <em style="display:inline list-item">emil</em> q</p>
<p>q <a href="x.html" style="display:inline list-item">ail</a> q</p>
<p>q <span style="display:inline list-item;list-style:none">nomark</span> q</p>
<p>q <span style="display:list-item inline flow-root">ifr</span> q</p>
<p>q <span role="note" style="display:inline list-item">noteil</span> q</p>
<p>q <span style="display:inline list-item;float:left">floated</span> q</p>
</body>
</html>
