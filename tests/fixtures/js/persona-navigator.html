<!-- persona identity contract (identity.md §8 — the deterministic JS-probe half
     of bl-46f5, extended by bl-3972). The VENDORED GOLDEN ORACLE for frot's JS
     persona: the values below are what a real Firefox 140esr on linux-x86_64
     en-US reports for the supported subset, and the probe self-checks each in JS,
     recording any regression into `data-fail` (empty array == all pass). The Rust
     gate (src/js/tests/persona_gold.rs) reads that array plus `data-ua`. Brand /
     prototype / descriptor / function-source checks pass, not just values. THIS
     FILE is the one place to edit when the profile moves: version-bound facts are
     asserted structurally (rv:/Firefox/), the stable identity facts exactly.
     Every global is declared via `var`, so the probe reads the same whatever
     language mode the script runs in (`script-mode.html` pins that). -->
<html>
<body>
<div id="probe">probe</div>
<script>
  var FAILS = [];
  function eq(name, actual, expected) {
    if (actual !== expected) FAILS.push(name + ': got ' + JSON.stringify(actual) + ' want ' + JSON.stringify(expected));
  }
  function ok(name, cond) { if (!cond) FAILS.push(name); }
  function threw(fn) { try { fn(); return null; } catch (e) { return e.name; } }
  // A frot web API must read as native code and never disclose prelude source or
  // the syscall name `frot` (identity.md §8, the branding contract).
  function native(name, fn) {
    var s = Function.prototype.toString.call(fn);
    ok(name + ':native', s.indexOf('[native code]') !== -1);
    ok(name + ':no-frot', s.indexOf('frot') === -1);
    ok(name + ':no-source', s.indexOf('return') === -1);
  }

  var n = navigator;

  // --- Stable identity facts, pinned exactly (§8) -----------------------------
  eq('platform', n.platform, 'Linux x86_64');
  eq('oscpu', n.oscpu, 'Linux x86_64');
  eq('language', n.language, 'en-US');
  eq('languages.length', n.languages.length, 2);
  eq('languages[0]', n.languages[0], 'en-US');
  eq('languages[1]', n.languages[1], 'en');
  eq('hardwareConcurrency', n.hardwareConcurrency, 8);
  eq('productSub', n.productSub, '20100101');
  eq('product', n.product, 'Gecko');
  eq('vendor', n.vendor, '');
  eq('vendorSub', n.vendorSub, '');
  eq('appName', n.appName, 'Netscape');
  eq('appCodeName', n.appCodeName, 'Mozilla');
  eq('onLine', n.onLine, true);
  eq('cookieEnabled', n.cookieEnabled, true);
  eq('doNotTrack', n.doNotTrack, 'unspecified');
  eq('maxTouchPoints', n.maxTouchPoints, 0);
  eq('buildID', n.buildID, '20181001000000');
  // Gecko freezes appVersion at the Mozilla-compat version + the WINDOWING
  // token, on every ESR line — it is not the UA minus `Mozilla/` (bl-6491).
  eq('appVersion', n.appVersion, '5.0 (X11)');
  eq('pdfViewerEnabled', n.pdfViewerEnabled, true);
  // webdriver is defined and false — absence is itself an odd fingerprint (§8).
  eq('webdriver', n.webdriver, false);

  // --- UA shape, version-agnostic (bl-3972 bumps 121->140 without editing this) -
  var ua = n.userAgent;
  ok('ua:prefix', ua.indexOf('Mozilla/5.0 (X11; Linux x86_64; rv:') === 0);
  ok('ua:gecko', ua.indexOf('Gecko/20100101') !== -1);
  ok('ua:firefox', ua.indexOf('Firefox/') !== -1);

  // --- plugins / mimeTypes: the Gecko PDF-viewer shim set (§8) -----------------
  eq('plugins.length', n.plugins.length, 5);
  eq('plugins[0].name', n.plugins[0].name, 'PDF Viewer');
  eq('plugins.item(0).name', n.plugins.item(0).name, 'PDF Viewer');
  eq('plugins.named', n.plugins.namedItem('PDF Viewer').name, 'PDF Viewer');
  eq('mimeTypes.length', n.mimeTypes.length, 2);
  eq('mimeTypes[0].type', n.mimeTypes[0].type, 'application/pdf');
  eq('mimeTypes[1].type', n.mimeTypes[1].type, 'text/pdf');
  eq('plugintag', Object.prototype.toString.call(n.plugins), '[object PluginArray]');

  // --- Firefox-shaped brand / prototype / descriptor (§8, §12) ----------------
  eq('nav:tag', Object.prototype.toString.call(n), '[object Navigator]');
  ok('nav:instanceof', n instanceof Navigator);
  ok('nav:proto', Object.getPrototypeOf(n) === Navigator.prototype);
  var d = Object.getOwnPropertyDescriptor(Navigator.prototype, 'userAgent');
  ok('nav:accessor', typeof d.get === 'function');
  ok('nav:no-set', d.set === undefined);
  ok('nav:enumerable', d.enumerable === true);
  ok('nav:configurable', d.configurable === true);
  // The getter is native, and it is NOT an own data property on the instance.
  native('nav:userAgent.get', d.get);
  ok('nav:not-own', Object.getOwnPropertyNames(n).indexOf('userAgent') === -1);

  // --- function-source branding (§8): the web APIs read native -----------------
  native('Navigator', Navigator);
  native('sendBeacon', n.sendBeacon);
  native('javaEnabled', n.javaEnabled);
  native('getRandomValues', crypto.getRandomValues);
  native('randomUUID', crypto.randomUUID);
  native('fetch', fetch);
  native('querySelector', document.querySelector);
  native('setTimeout', setTimeout);
  native('addEventListener', addEventListener);
  native('toString', Function.prototype.toString);

  // --- screen / devicePixelRatio / visibility (§8, bl-1cb7) --------------------
  eq('screen:tag', Object.prototype.toString.call(screen), '[object Screen]');
  eq('screen.width', screen.width, 1280);
  eq('screen.height', screen.height, 720);
  eq('screen.availWidth', screen.availWidth, 1280);
  eq('screen.availHeight', screen.availHeight, 720);
  eq('screen.colorDepth', screen.colorDepth, 24);
  eq('screen.pixelDepth', screen.pixelDepth, 24);
  eq('devicePixelRatio', devicePixelRatio, 1);
  eq('orientation', screen.orientation.type, 'landscape-primary');
  eq('visibilityState', document.visibilityState, 'visible');
  eq('hidden', document.hidden, false);
  ok('hasFocus', document.hasFocus() === true);
  // screen agrees with the window viewport (no contradiction across surfaces).
  eq('screen==inner', screen.width, window.innerWidth);

  // --- Intl: minimal DateTimeFormat resolvedOptions matching the profile (§8) --
  eq('intl:tag', Object.prototype.toString.call(Intl), '[object Intl]');
  var ro = new Intl.DateTimeFormat().resolvedOptions();
  eq('intl:locale', ro.locale, 'en-US');
  eq('intl:timeZone', ro.timeZone, 'UTC');
  eq('intl:calendar', ro.calendar, 'gregory');
  eq('intl:numberingSystem', ro.numberingSystem, 'latn');
  // A requested locale is honoured (resolvedOptions reflects it).
  eq('intl:requested', new Intl.DateTimeFormat('fr').resolvedOptions().locale, 'fr');

  // --- crypto: real OS randomness, browser behaviour (§8, bl-cf3a) -------------
  eq('crypto:tag', Object.prototype.toString.call(crypto), '[object Crypto]');
  var buf = new Uint8Array(16);
  ok('crypto:returns-view', crypto.getRandomValues(buf) === buf);
  eq('crypto:len', buf.length, 16);
  ok('uuid:v4', /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(crypto.randomUUID()));
  ok('uuid:distinct', crypto.randomUUID() !== crypto.randomUUID());

  // --- Worker / SharedWorker: coherent constructor presence, no execution ------
  // (bl-342a) Firefox exposes these; frot masquerades the surface (feature detect
  // passes) but spawns no thread — a constructed worker never delivers a message
  // (the declared residual, identity.md §11). Present, native, Firefox-shaped.
  eq('Worker:type', typeof Worker, 'function');
  ok('Worker:in', 'Worker' in window);
  native('Worker', Worker);
  var w = new Worker('data:,');
  eq('worker:tag', Object.prototype.toString.call(w), '[object Worker]');
  ok('worker:instanceof', w instanceof Worker);
  ok('worker:proto', Object.getPrototypeOf(w) === Worker.prototype);
  native('worker:postMessage', w.postMessage);
  native('worker:terminate', w.terminate);
  // No thread behind them: the calls are honest no-ops returning undefined.
  ok('worker:postMessage-void', w.postMessage('x') === undefined);
  ok('worker:terminate-void', w.terminate() === undefined);
  // onmessage is a native, enumerable prototype accessor defaulting null, and
  // settable — but it never fires (the residual is silence, not a wrong value).
  eq('worker:onmessage-default', w.onmessage, null);
  var wd = Object.getOwnPropertyDescriptor(Worker.prototype, 'onmessage');
  ok('worker:onmessage-accessor', typeof wd.get === 'function' && typeof wd.set === 'function');
  ok('worker:onmessage-enumerable', wd.enumerable === true);
  native('worker:onmessage.get', wd.get);
  var wh = function () {};
  w.onmessage = wh;
  ok('worker:onmessage-set', w.onmessage === wh);
  // Firefox throws TypeError when the required scriptURL argument is missing.
  eq('worker:no-arg', threw(function () { new Worker(); }), 'TypeError');

  eq('SharedWorker:type', typeof SharedWorker, 'function');
  native('SharedWorker', SharedWorker);
  var sw = new SharedWorker('data:,');
  eq('sharedworker:tag', Object.prototype.toString.call(sw), '[object SharedWorker]');
  ok('sharedworker:instanceof', sw instanceof SharedWorker);
  // port is a MessagePort-shaped object (SharedWorker's coherent shape); it too
  // never delivers, since there is no thread on the other end.
  eq('sharedworker:port-tag', Object.prototype.toString.call(sw.port), '[object MessagePort]');
  ok('sharedworker:port-instanceof', sw.port instanceof MessagePort);
  native('sharedworker:port.postMessage', sw.port.postMessage);
  ok('sharedworker:port-void', sw.port.postMessage('x') === undefined);

  // --- IndexedDB: coherent factory + interface-zoo presence, no persistence ----
  // (bl-8dde) Firefox exposes indexedDB; frot masquerades the surface so feature
  // detection passes, but is stateless — open() returns a Firefox-shaped
  // IDBOpenDBRequest that stays 'pending' forever (onsuccess/onupgradeneeded never
  // fire: the declared residual, identity.md §11). Less detectable than an error,
  // which a real fresh open() never produces.
  ok('idb:in', 'indexedDB' in window);
  ok('idb:instanceof', indexedDB instanceof IDBFactory);
  eq('idb:tag', Object.prototype.toString.call(indexedDB), '[object IDBFactory]');
  eq('idb:open-type', typeof indexedDB.open, 'function');
  native('idb:open', indexedDB.open);
  native('idb:deleteDatabase', indexedDB.deleteDatabase);
  native('idb:cmp', indexedDB.cmp);
  native('idb:databases', indexedDB.databases);
  // cmp: a real, coherent synchronous key comparison (type ranking + values).
  eq('idb:cmp-num', indexedDB.cmp(1, 2), -1);
  eq('idb:cmp-eq', indexedDB.cmp(5, 5), 0);
  eq('idb:cmp-str', indexedDB.cmp('b', 'a'), 1);
  eq('idb:cmp-rank', indexedDB.cmp(9, 'a'), -1);   // number < string
  eq('idb:cmp-date', indexedDB.cmp(new Date(2), new Date(1)), 1);
  eq('idb:cmp-arr', indexedDB.cmp([1, 2], [1, 2, 3]), -1);
  eq('idb:cmp-invalid', threw(function () { indexedDB.cmp(null, 1); }), 'DataError');
  eq('idb:cmp-arity', threw(function () { indexedDB.cmp(1); }), 'TypeError');
  // databases() honestly resolves to [] (a stateless store has none).
  ok('idb:databases-promise', indexedDB.databases() instanceof Promise);

  // open() returns a Firefox-shaped, permanently-pending IDBOpenDBRequest.
  var req = indexedDB.open('frot');
  eq('idb:req-tag', Object.prototype.toString.call(req), '[object IDBOpenDBRequest]');
  ok('idb:req-open-instanceof', req instanceof IDBOpenDBRequest);
  ok('idb:req-req-instanceof', req instanceof IDBRequest);
  eq('idb:req-readyState', req.readyState, 'pending');
  eq('idb:req-source', req.source, null);
  eq('idb:req-transaction', req.transaction, null);
  // While pending, result/error throw InvalidStateError — exactly like Firefox.
  eq('idb:req-result-throws', threw(function () { return req.result; }), 'InvalidStateError');
  eq('idb:req-error-throws', threw(function () { return req.error; }), 'InvalidStateError');
  // onupgradeneeded/onsuccess: native, enumerable prototype accessors defaulting
  // null and settable — but they NEVER fire (the residual is silence).
  eq('idb:onupgradeneeded-default', req.onupgradeneeded, null);
  var od = Object.getOwnPropertyDescriptor(IDBOpenDBRequest.prototype, 'onupgradeneeded');
  ok('idb:onupgradeneeded-accessor', typeof od.get === 'function' && typeof od.set === 'function');
  ok('idb:onupgradeneeded-enumerable', od.enumerable === true);
  native('idb:onupgradeneeded.get', od.get);
  var oh = function () {};
  req.onsuccess = oh;
  ok('idb:onsuccess-set', req.onsuccess === oh);
  // Firefox throws TypeError for a missing name and for an illegal version (0).
  eq('idb:open-no-arg', threw(function () { indexedDB.open(); }), 'TypeError');
  eq('idb:open-bad-version', threw(function () { indexedDB.open('x', 0); }), 'TypeError');
  ok('idb:open-good-version', indexedDB.open('x', 3) instanceof IDBOpenDBRequest);
  eq('idb:delete-no-arg', threw(function () { indexedDB.deleteDatabase(); }), 'TypeError');
  ok('idb:delete-req', indexedDB.deleteDatabase('x') instanceof IDBOpenDBRequest);

  // Interface zoo: present, native, Firefox-shaped, non-constructable (Illegal).
  ['IDBFactory', 'IDBRequest', 'IDBOpenDBRequest', 'IDBDatabase', 'IDBTransaction',
    'IDBObjectStore', 'IDBIndex', 'IDBCursor', 'IDBCursorWithValue', 'IDBKeyRange'
  ].forEach(function (nm) {
    eq('idbzoo:' + nm + '-type', typeof window[nm], 'function');
    native('idbzoo:' + nm, window[nm]);
    eq('idbzoo:' + nm + '-illegal', threw(function () { new window[nm](); }), 'TypeError');
    eq('idbzoo:' + nm + '-tag', Object.prototype.toString.call(window[nm].prototype), '[object ' + nm + ']');
  });
  ok('idb:cursorvalue-chain', IDBCursorWithValue.prototype instanceof IDBCursor);
  // IDBVersionChangeEvent IS constructable (an Event subtype), unlike the zoo.
  eq('idbvce:type', typeof IDBVersionChangeEvent, 'function');
  native('idbvce', IDBVersionChangeEvent);
  var vce = new IDBVersionChangeEvent('versionchange', { oldVersion: 1, newVersion: 2 });
  ok('idbvce:instanceof-event', vce instanceof Event);
  eq('idbvce:tag', Object.prototype.toString.call(vce), '[object IDBVersionChangeEvent]');
  eq('idbvce:old', vce.oldVersion, 1);
  eq('idbvce:new', vce.newVersion, 2);
  eq('idbvce:default-old', new IDBVersionChangeEvent('x').oldVersion, 0);
  eq('idbvce:default-new', new IDBVersionChangeEvent('x').newVersion, null);
  eq('idbvce:no-arg', threw(function () { new IDBVersionChangeEvent(); }), 'TypeError');

  // --- Permissions / Notification: coherent presence, no grant (bl-1548) -------
  // Firefox exposes both; frot masquerades the surface (feature detect passes)
  // with every value fixed — a fresh profile grants nothing, so query() resolves
  // 'prompt' and Notification.permission is 'default'. No prompt is ever raised
  // and no notification shown: the honest no-grant is the declared residual (§11).
  var perms = navigator.permissions;
  eq('perm:tag', Object.prototype.toString.call(perms), '[object Permissions]');
  ok('perm:instanceof', perms instanceof Permissions);
  ok('perm:proto', Object.getPrototypeOf(perms) === Permissions.prototype);
  native('perm:query', perms.query);
  ok('perm:query-promise', perms.query({ name: 'geolocation' }) instanceof Promise);
  // PermissionStatus is not constructable (Firefox: Illegal constructor).
  eq('perm:status-illegal', threw(function () { new PermissionStatus(); }), 'TypeError');

  eq('Notification:type', typeof Notification, 'function');
  native('Notification', Notification);
  // Static surface: permission 'default', maxActions 2, requestPermission present.
  eq('Notification:permission', Notification.permission, 'default');
  eq('Notification:maxActions', Notification.maxActions, 2);
  native('Notification:requestPermission', Notification.requestPermission);
  ok('Notification:req-promise', Notification.requestPermission() instanceof Promise);
  var note = new Notification('hi', { body: 'b', tag: 't' });
  eq('note:tag', Object.prototype.toString.call(note), '[object Notification]');
  ok('note:instanceof', note instanceof Notification);
  eq('note:title', note.title, 'hi');
  eq('note:body', note.body, 'b');
  eq('note:tagprop', note.tag, 't');
  eq('note:dir-default', note.dir, 'auto');
  // onclick is a native, enumerable prototype accessor defaulting null, settable —
  // but it never fires (the residual is silence: frot shows no notification).
  eq('note:onclick-default', note.onclick, null);
  var nd = Object.getOwnPropertyDescriptor(Notification.prototype, 'onclick');
  ok('note:onclick-accessor', typeof nd.get === 'function' && typeof nd.set === 'function');
  ok('note:onclick-enumerable', nd.enumerable === true);
  native('note:onclick.get', nd.get);
  var nh = function () {};
  note.onclick = nh;
  ok('note:onclick-set', note.onclick === nh);
  ok('note:close-void', note.close() === undefined);
  // Firefox throws TypeError when the required title argument is missing.
  eq('note:no-arg', threw(function () { new Notification(); }), 'TypeError');

  // Async: query()/requestPermission() resolutions and rejections. Their .then
  // callbacks run in the microtask drain AFTER this script, so they fold into
  // FAILS and re-write data-fail below — the Rust gate reads it only after settle.
  function permOk(nm) {
    return perms.query({ name: nm }).then(function (s) {
      ok('perm:' + nm + ':status', s instanceof PermissionStatus);
      eq('perm:' + nm + ':tag', Object.prototype.toString.call(s), '[object PermissionStatus]');
      eq('perm:' + nm + ':state', s.state, 'prompt');
      eq('perm:' + nm + ':name', s.name, nm);
      eq('perm:' + nm + ':onchange', s.onchange, null);
      native('perm:' + nm + ':addEventListener', s.addEventListener);
    }, function () { FAILS.push('perm:' + nm + ':rejected'); });
  }
  function permRejects(desc, arg) {
    return perms.query(arg).then(
      function () { FAILS.push(desc + ':resolved'); },
      function (e) { ok(desc + ':TypeError', e instanceof TypeError); });
  }
  var asyncChecks = [
    permOk('geolocation'), permOk('notifications'), permOk('camera'),
    permRejects('perm:bogus', { name: 'bogus' }),   // unknown enum value
    permRejects('perm:noname', {}),                 // missing required member
    permRejects('perm:nonobj', 'geolocation'),      // not an object
    // Zero-argument call: the WebIDL arity error, also a rejected promise.
    perms.query().then(
      function () { FAILS.push('perm:zeroarg:resolved'); },
      function (e) { ok('perm:zeroarg:TypeError', e instanceof TypeError); }),
    // requestPermission resolves an honest 'default' (no grant), both the promise
    // and the legacy callback forms — no prompt is ever raised (the residual).
    Notification.requestPermission(function (p) {
      eq('Notification:req-callback', p, 'default');
    }).then(function (p) {
      eq('Notification:req-value', p, 'default');
    }),
  ];

  // --- Canvas 2D: a coherent, DETERMINISTIC fingerprint masquerade (bl-05e6) ---
  // (identity.md §11) Firefox returns a 2D context; frot does too, and folds the
  // draw sequence into a deterministic, profile-seeded digest. getContext('2d') is
  // branded native; toDataURL/getImageData are STABLE per draw sequence, VARY with
  // content, and are well-formed (image/png, right dimensions) — never random per
  // call (the tell privacy tools show), never a wrong value. WebGL stays null.
  var cv = document.createElement('canvas');
  cv.width = 200; cv.height = 50;
  eq('canvas:instanceof', cv instanceof HTMLCanvasElement, true);
  eq('canvas:width', cv.width, 200);
  eq('canvas:height', cv.height, 50);
  var cx = cv.getContext('2d');
  eq('canvas:ctx-tag', Object.prototype.toString.call(cx), '[object CanvasRenderingContext2D]');
  ok('canvas:ctx-instanceof', cx instanceof CanvasRenderingContext2D);
  ok('canvas:ctx-canvas', cx.canvas === cv);
  native('canvas:getContext', cv.getContext);
  native('canvas:toDataURL', cv.toDataURL);
  native('canvas:fillText', cx.fillText);
  native('canvas:getImageData', cx.getImageData);
  // A canvas binds ONE context type (bl-f624): this one is 2D, so getContext('webgl')
  // now returns null by exclusivity. A non-canvas element gets undefined.
  eq('canvas:webgl-excluded', String(cv.getContext('webgl')), 'null');
  eq('canvas:div-getContext', document.createElement('div').getContext('2d'), undefined);
  // Draw a standard fingerprint sequence, then read it back two ways.
  cx.textBaseline = 'top';
  cx.font = '14px sans-serif';
  cx.fillStyle = '#069';
  cx.fillText('frot-Cwm fjord \u{1f600}', 2, 2);
  cx.fillStyle = 'rgba(102,204,0,0.7)';
  cx.fillRect(8, 8, 40, 20);
  var url = cv.toDataURL();
  ok('canvas:png-prefix', url.indexOf('data:image/png;base64,') === 0);
  // STABLE: the same draw sequence hashes identically on repeat reads.
  eq('canvas:stable', cv.toDataURL(), url);
  // VARIES with content: one changed glyph yields a different image.
  var cv2 = document.createElement('canvas');
  cv2.width = 200; cv2.height = 50;
  var cx2 = cv2.getContext('2d');
  cx2.textBaseline = 'top'; cx2.font = '14px sans-serif'; cx2.fillStyle = '#069';
  cx2.fillText('frot-Cwm fjard \u{1f600}', 2, 2); // 'fjord' -> 'fjard'
  cx2.fillStyle = 'rgba(102,204,0,0.7)'; cx2.fillRect(8, 8, 40, 20);
  ok('canvas:varies', cv2.toDataURL() !== url);
  // getImageData: well-formed ImageData of the right size, and CONSISTENT with the
  // data URL (both derive from the one deterministic bitmap).
  var img = cx.getImageData(0, 0, 200, 50);
  eq('canvas:img-tag', Object.prototype.toString.call(img), '[object ImageData]');
  ok('canvas:img-instanceof', img instanceof ImageData);
  eq('canvas:img-w', img.width, 200);
  eq('canvas:img-h', img.height, 50);
  eq('canvas:img-len', img.data.length, 200 * 50 * 4);
  eq('canvas:img-colorspace', img.colorSpace, 'srgb');
  ok('canvas:img-stable', cx.getImageData(0, 0, 200, 50).data[123] === img.data[123]);
  // A never-drawn canvas is transparent, exactly like a real one (all-zero pixels).
  ok('canvas:blank-transparent', document.createElement('canvas').getContext('2d').getImageData(0, 0, 1, 1).data[3] === 0);
  // measureText: deterministic width, stable and text-varying (font channel).
  eq('canvas:measure-stable', cx.measureText('abc').width, cx.measureText('abc').width);
  ok('canvas:measure-varies', cx.measureText('abc').width !== cx.measureText('abcd').width);
  // The digest a fingerprinter hashes — pinned to <html data-canvas> so the Rust
  // gate can prove it is byte-identical ACROSS two independent frot invocations.
  var CANVAS_HASH = url;

  // --- WebGL: a coherent, DETERMINISTIC fingerprint masquerade (bl-f624) --------
  // (identity.md §10/§11) Firefox exposes WebGL(2)RenderingContext and a context;
  // frot does too, Firefox-shaped and branded native. VENDOR/RENDERER are masked to
  // "Mozilla"; the real GPU strings surface only via WEBGL_debug_renderer_info and
  // name Mesa llvmpipe (software, coherent for Firefox-on-Linux, never over-claiming
  // hardware). Limits/extensions/precision are one real llvmpipe build's set;
  // readPixels/toDataURL are deterministic across invocations and vary with content.
  ok('WebGLRenderingContext:type', typeof WebGLRenderingContext === 'function');
  ok('WebGL2RenderingContext:type', typeof WebGL2RenderingContext === 'function');
  native('WebGLRenderingContext', WebGLRenderingContext);
  var gcv = document.createElement('canvas');
  gcv.width = 128; gcv.height = 128;
  var gl = gcv.getContext('webgl');
  ok('webgl:ctx-instanceof', gl instanceof WebGLRenderingContext);
  eq('webgl:ctx-tag', Object.prototype.toString.call(gl), '[object WebGLRenderingContext]');
  ok('webgl:ctx-canvas', gl.canvas === gcv);
  // experimental-webgl aliases the same version -> the same context object.
  ok('webgl:experimental-same', gcv.getContext('experimental-webgl') === gl);
  native('webgl:getParameter', gl.getParameter);
  native('webgl:getExtension', gl.getExtension);
  // Masked vendor, generalized renderer: Firefox reports VENDOR 'Mozilla' but a
  // bucketed '<class>, or similar' renderer, the SAME string the debug extension
  // gives (measured on 140esr and 153esr, bl-b128) — never the raw driver string.
  eq('webgl:vendor-masked', gl.getParameter(gl.VENDOR), 'Mozilla');
  eq('webgl:renderer-generalized', gl.getParameter(gl.RENDERER), 'llvmpipe, or similar');
  var dbg = gl.getExtension('WEBGL_debug_renderer_info');
  eq('webgl:renderer-same-both-slots', gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL),
     gl.getParameter(gl.RENDERER));
  ok('webgl:renderer-no-driver-version', gl.getParameter(gl.RENDERER).indexOf('LLVM') === -1);
  eq('webgl:version', gl.getParameter(gl.VERSION), 'WebGL 1.0');
  eq('webgl:glsl', gl.getParameter(gl.SHADING_LANGUAGE_VERSION), 'WebGL GLSL ES 1.0');
  // UNMASKED via the debug-renderer extension: coherent Mesa/llvmpipe, Linux-plausible.
  var dbg = gl.getExtension('WEBGL_debug_renderer_info');
  ok('webgl:dbg-ext', !!dbg);
  eq('webgl:unmasked-vendor', gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL), 'Mesa');
  var UNR = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
  ok('webgl:unmasked-renderer', UNR.indexOf('llvmpipe') === 0);
  // Coherence: the masked slots must NOT leak the real GPU string.
  ok('webgl:mask-no-leak', gl.getParameter(gl.VENDOR).indexOf('llvmpipe') === -1);
  // Limits: scalar, and range/dims as the right typed array.
  eq('webgl:max-texture', gl.getParameter(gl.MAX_TEXTURE_SIZE), 16384);
  eq('webgl:max-attribs', gl.getParameter(gl.MAX_VERTEX_ATTRIBS), 16);
  var vp = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
  ok('webgl:viewport-int32', vp instanceof Int32Array && vp[0] === 16384 && vp[1] === 16384);
  var lw = gl.getParameter(gl.ALIASED_LINE_WIDTH_RANGE);
  ok('webgl:linewidth-float32', lw instanceof Float32Array && lw[0] === 1 && lw[1] === 1);
  // Unknown enum -> null, exactly as Firefox answers.
  eq('webgl:unknown-null', gl.getParameter(0x9999), null);
  eq('webgl:ext-unknown-null', gl.getExtension('WEBGL_nonexistent'), null);
  // Extension list: coherent with software llvmpipe as MEASURED (anisotropy and
  // ASTC both present — this Mesa's llvmpipe advertises ASTC, bl-b128).
  var exts = gl.getSupportedExtensions();
  ok('webgl:ext-debug', exts.indexOf('WEBGL_debug_renderer_info') !== -1);
  ok('webgl:ext-aniso', exts.indexOf('EXT_texture_filter_anisotropic') !== -1);
  ok('webgl:ext-astc', exts.indexOf('WEBGL_compressed_texture_astc') !== -1);
  // Precision: desktop GL signature — every float qualifier is highp {127,127,23}.
  var hf = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
  eq('webgl:precision-high', hf.precision, 23);
  var mf = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.MEDIUM_FLOAT);
  eq('webgl:precision-medium', mf.precision, 23);
  // WebGL2: separate branded interface, coherent WebGL2 facts.
  var g2cv = document.createElement('canvas'); g2cv.width = 128; g2cv.height = 128;
  var gl2 = g2cv.getContext('webgl2');
  ok('webgl2:instanceof', gl2 instanceof WebGL2RenderingContext);
  eq('webgl2:version', gl2.getParameter(gl2.VERSION), 'WebGL 2.0');
  eq('webgl2:max-3d', gl2.getParameter(gl2.MAX_3D_TEXTURE_SIZE), 2048);
  // Exclusivity + legacy names: a webgl canvas refuses 2d; moz-webgl is null.
  eq('webgl:excl-2d', String(gcv.getContext('2d')), 'null');
  eq('webgl:moz-null', String(gcv.getContext('moz-webgl')), 'null');
  // Deterministic render: a fixed sequence, read two ways, stable and opaque.
  gl.clearColor(0.1, 0.2, 0.3, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  var sh = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(sh, 'void main(){gl_Position=vec4(0.0,0.0,0.0,1.0);}');
  gl.compileShader(sh);
  ok('webgl:compile-ok', gl.getShaderParameter(sh, gl.COMPILE_STATUS) === true);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  var b1 = new Uint8Array(128 * 128 * 4);
  gl.readPixels(0, 0, 128, 128, gl.RGBA, gl.UNSIGNED_BYTE, b1);
  var b2 = new Uint8Array(128 * 128 * 4);
  gl.readPixels(0, 0, 128, 128, gl.RGBA, gl.UNSIGNED_BYTE, b2);
  ok('webgl:readpixels-stable', b1[100] === b2[100] && b1[3] === 255);
  var WEBGL_HASH = gcv.toDataURL();
  ok('webgl:png-prefix', WEBGL_HASH.indexOf('data:image/png;base64,') === 0);
  eq('webgl:toDataURL-stable', gcv.toDataURL(), WEBGL_HASH);
  // Content-varies: a different draw sequence yields a different image.
  var vcv = document.createElement('canvas'); vcv.width = 128; vcv.height = 128;
  var glv = vcv.getContext('webgl');
  glv.clearColor(0.9, 0.1, 0.1, 1.0); glv.clear(glv.COLOR_BUFFER_BIT);
  glv.drawArrays(glv.TRIANGLES, 0, 6);
  ok('webgl:varies', vcv.toDataURL() !== WEBGL_HASH);

  // --- Web Audio: a coherent, DETERMINISTIC fingerprint masquerade (bl-8733) ----
  // (identity.md §10/§11) Firefox exposes AudioContext/OfflineAudioContext; frot
  // does too, Firefox-shaped and branded native, with NO webkit-prefixed alias.
  // OfflineAudioContext.startRendering() resolves an AudioBuffer whose float samples
  // are a deterministic function of the graph digest — stable across invocations,
  // varying with the graph, in [-1,1]. sampleRate is Firefox's 44100.
  ok('AudioContext:type', typeof AudioContext === 'function');
  ok('OfflineAudioContext:type', typeof OfflineAudioContext === 'function');
  ok('BaseAudioContext:type', typeof BaseAudioContext === 'function');
  // NO webkit-prefixed alias (Firefox has none) — its presence would be the tell.
  eq('audio:no-webkit', typeof webkitAudioContext, 'undefined');
  native('AudioContext', AudioContext);
  native('OfflineAudioContext', OfflineAudioContext);
  // BaseAudioContext is abstract (Illegal constructor); the concrete ones build.
  eq('BaseAudioContext:illegal', threw(function () { new BaseAudioContext(); }), 'TypeError');
  var ac = new AudioContext();
  eq('ac:tag', Object.prototype.toString.call(ac), '[object AudioContext]');
  ok('ac:instanceof', ac instanceof AudioContext);
  ok('ac:base-instanceof', ac instanceof BaseAudioContext);
  eq('ac:sampleRate', ac.sampleRate, 44100);
  eq('ac:state', ac.state, 'suspended');
  eq('ac:currentTime', ac.currentTime, 0);
  // Linux Firefox reports baseLatency 0 with audio flowing (measured, both ESR
  // lines); outputLatency is the device buffer and is positive.
  ok('ac:baseLatency', typeof ac.baseLatency === 'number' && ac.baseLatency === 0);
  ok('ac:outputLatency', ac.outputLatency > 0.033 && ac.outputLatency < 0.044);
  ok('ac:resume-promise', ac.resume() instanceof Promise);
  ok('ac:suspend-promise', ac.suspend() instanceof Promise);
  ok('ac:close-promise', ac.close() instanceof Promise);
  // destination is a branded AudioDestinationNode with a coherent maxChannelCount.
  eq('ac:dest-tag', Object.prototype.toString.call(ac.destination), '[object AudioDestinationNode]');
  ok('ac:dest-node', ac.destination instanceof AudioNode);
  eq('ac:dest-maxch', ac.destination.maxChannelCount, 2);
  native('ac:createOscillator', ac.createOscillator);
  native('ac:createDynamicsCompressor', ac.createDynamicsCompressor);
  native('ac:createGain', ac.createGain);
  native('ac:createAnalyser', ac.createAnalyser);
  // Node zoo presence: analyser / biquad / buffer-source, Firefox-shaped + branded.
  var an = ac.createAnalyser();
  eq('an:tag', Object.prototype.toString.call(an), '[object AnalyserNode]');
  eq('an:bins', an.frequencyBinCount, 1024);
  eq('an:fft', an.fftSize, 2048);
  an.getFloatFrequencyData(new Float32Array(1024)); // present, offline no-op (residual).
  var gain = ac.createGain();
  ok('gain:param', gain.gain.value === 1 && gain.gain.setValueAtTime(0.5, 0) === gain.gain);
  eq('gain:param-default', gain.gain.defaultValue, 1);
  ok('gain:param-range', gain.gain.minValue < 0 && gain.gain.maxValue > 0);
  var bq = ac.createBiquadFilter();
  eq('bq:tag', Object.prototype.toString.call(bq), '[object BiquadFilterNode]');
  bq.getFrequencyResponse(new Float32Array(1), new Float32Array(1), new Float32Array(1));
  var bs = ac.createBufferSource();
  eq('bs:tag', Object.prototype.toString.call(bs), '[object AudioBufferSourceNode]');
  bs.disconnect();
  // AudioBuffer: constructable, silent when fresh, copy round-trips, OOB throws.
  native('buf:getChannelData', AudioBuffer.prototype.getChannelData);
  var sb = ac.createBuffer(1, 16, 44100);
  eq('buf:tag', Object.prototype.toString.call(sb), '[object AudioBuffer]');
  eq('buf:len', sb.length, 16);
  eq('buf:duration', sb.duration, 16 / 44100);
  eq('buf:silent', sb.getChannelData(0)[0], 0);
  var wr = new Float32Array(4); wr[0] = 0.5;
  sb.copyToChannel(wr, 0, 0);
  var rd = new Float32Array(4); sb.copyFromChannel(rd, 0, 0);
  ok('buf:copy', rd[0] === 0.5);
  eq('buf:oob', threw(function () { sb.getChannelData(5); }), 'IndexSizeError');
  var ab = new AudioBuffer({ length: 8, sampleRate: 44100 });
  eq('ab:len', ab.length, 8);
  eq('ab:default-channels', ab.numberOfChannels, 1);
  eq('ab:missing', threw(function () { new AudioBuffer({}); }), 'TypeError');
  // OfflineAudioContext requires its 3 args (Firefox: TypeError otherwise).
  eq('oac:no-arg', threw(function () { new OfflineAudioContext(); }), 'TypeError');
  // The option-dictionary constructor form, and the `new NodeName(ctx, opts)` form.
  var ocd = new OfflineAudioContext({ numberOfChannels: 2, length: 128, sampleRate: 44100 });
  eq('oac:dict-len', ocd.length, 128);
  eq('oac:dict-dest-maxch', ocd.destination.maxChannelCount, 2);
  var osc2 = new OscillatorNode(ocd, { type: 'square' });
  eq('osc2:type', osc2.type, 'square');
  ok('osc2:node', osc2 instanceof OscillatorNode && osc2 instanceof AudioNode);
  ok('oac:suspend-promise', ocd.suspend() instanceof Promise);
  // The classic fingerprint graph: oscillator -> compressor -> destination.
  function fpGraph(freq) {
    var oc = new OfflineAudioContext(1, 44100, 44100);
    eq('oac:tag', Object.prototype.toString.call(oc), '[object OfflineAudioContext]');
    ok('oac:base-instanceof', oc instanceof BaseAudioContext);
    eq('oac:length', oc.length, 44100);
    eq('oac:sampleRate', oc.sampleRate, 44100);
    var osc = oc.createOscillator();
    eq('osc:tag', Object.prototype.toString.call(osc), '[object OscillatorNode]');
    ok('osc:node', osc instanceof AudioNode);
    eq('osc:freq-param', Object.prototype.toString.call(osc.frequency), '[object AudioParam]');
    osc.type = 'triangle';
    eq('osc:type', osc.type, 'triangle');
    osc.frequency.value = freq;
    eq('osc:freq-value', osc.frequency.value, freq);
    var comp = oc.createDynamicsCompressor();
    eq('comp:tag', Object.prototype.toString.call(comp), '[object DynamicsCompressorNode]');
    eq('comp:reduction', comp.reduction, 0);
    comp.threshold.value = -50; comp.knee.value = 40; comp.ratio.value = 12;
    comp.attack.value = 0; comp.release.value = 0.25;
    ok('connect:chains', osc.connect(comp) === comp); // connect returns its dest.
    comp.connect(oc.destination);
    osc.start(0);
    return oc;
  }
  var AUDIO_HASH = null;
  function audioDigest(buf) {
    // Sum the classic fingerprint window (samples 4500..5000), as fingerprinters do.
    var d = buf.getChannelData(0);
    var sum = 0;
    for (var i = 4500; i < 5000; i++) sum += Math.abs(d[i]);
    return sum;
  }
  var completeFired = false;
  var oc1 = fpGraph(10000);
  // oncomplete: an Event-shaped OfflineAudioCompletionEvent carrying renderedBuffer
  // (the fingerprintjs delivery path), fired alongside the startRendering promise.
  oc1.oncomplete = function (ev) {
    completeFired = true;
    eq('oac:complete-tag', Object.prototype.toString.call(ev), '[object OfflineAudioCompletionEvent]');
    ok('oac:complete-event', ev instanceof Event);
    eq('oac:complete-type', ev.type, 'complete');
    ok('oac:complete-buffer', ev.renderedBuffer instanceof AudioBuffer);
  };
  eq('oac:oncomplete-set', typeof oc1.oncomplete, 'function');
  eq('oac:oncomplete-null', new OfflineAudioContext(1, 8, 44100).oncomplete, null);
  native('oac:startRendering', oc1.startRendering);
  var audioChecks = oc1.startRendering().then(function (buf) {
    ok('oac:complete-fired', completeFired);
    eq('oac:buf-tag', Object.prototype.toString.call(buf), '[object AudioBuffer]');
    ok('oac:buf-instanceof', buf instanceof AudioBuffer);
    eq('oac:buf-len', buf.length, 44100);
    var data = buf.getChannelData(0);
    var inRange = true;
    for (var i = 0; i < data.length; i++) { if (data[i] < -1 || data[i] > 1) { inRange = false; break; } }
    ok('oac:in-range', inRange); // plausible audio samples.
    ok('oac:stable-within', buf.getChannelData(0)[4567] === data[4567]);
    var h = String(audioDigest(buf));
    AUDIO_HASH = h;
    // Pinned to <html data-audio> so the Rust gate can prove it is byte-identical
    // ACROSS two independent frot invocations (determinism a real device shows).
    document.documentElement.setAttribute('data-audio', h);
    // DETERMINISTIC: an identical graph renders the identical hash.
    return fpGraph(10000).startRendering().then(function (same) {
      ok('oac:deterministic', String(audioDigest(same)) === h);
      // GRAPH-VARYING: a different oscillator frequency renders a different hash.
      return fpGraph(15000).startRendering().then(function (diff) {
        ok('oac:graph-varies', String(audioDigest(diff)) !== h);
      });
    });
  });
  asyncChecks.push(audioChecks);

  // --- Absent capability surfaces (§8): masquerade does not fabricate these ----
  eq('serviceWorker', typeof n.serviceWorker, 'undefined');
  eq('geolocation', typeof n.geolocation, 'undefined');
  // sendBeacon is a legal denial, never a submission (§6): defined, returns false.
  ok('sendBeacon:false', n.sendBeacon() === false);

  var de = document.documentElement;
  de.setAttribute('data-ua', ua);
  // The deterministic canvas fingerprint (bl-05e6): the Rust gate runs this page
  // twice and asserts this attribute is byte-identical, proving determinism holds
  // ACROSS invocations (not merely within one), the property a real device shows.
  de.setAttribute('data-canvas', CANVAS_HASH);
  // The deterministic WebGL fingerprint (bl-f624): same cross-invocation proof as
  // canvas — the gate runs this page twice and asserts byte-identical.
  de.setAttribute('data-webgl', WEBGL_HASH);
  de.setAttribute('data-fail', JSON.stringify(FAILS));
  de.setAttribute('data-done', '1');
  // Re-write data-fail after the async permission checks settle (see above): the
  // microtask drain runs before the gate reads the attribute, so this wins.
  Promise.all(asyncChecks).then(function () {
    de.setAttribute('data-fail', JSON.stringify(FAILS));
  });
</script>
