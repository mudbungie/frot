<!-- env-contract golden (js.md §7 + §4.4/§5 lifecycle) — the EXECUTABLE contract
     for frot's JS environment surface. The probe self-checks every fact in JS and
     records any regression into `data-fail` (empty array == all pass); the Rust
     gate (src/js/tests/envgold.rs) only reads that array plus the report facts it
     alone can see (scripts/errors/settled). THIS FILE is the one place to edit
     when a future ball adds or removes an API. Page scripts run strict (a bare
     undeclared assignment throws), so every global is declared via `var`. -->
<html>
<body>
<div id="probe">probe</div>
<script>
  // Accumulated failures — a descriptive string per regressed fact.
  var FAILS = [];
  // Ordered lifecycle markers, appended as each phase runs.
  var ORDER = [];
  // readyState / performance.now snapshots, filled across the run's phases.
  var RS = {};

  function check(name, cond) {
    if (!cond) FAILS.push(name);
  }
  function eq(name, actual, expected) {
    if (actual !== expected) FAILS.push(name + ': got ' + JSON.stringify(actual) + ' want ' + JSON.stringify(expected));
  }

  // --- Present: language + host globals the shims and pages rely on (§7) ------
  eq('present:queueMicrotask', typeof queueMicrotask, 'function');
  eq('present:performance.now', typeof performance.now, 'function');
  eq('present:Promise', typeof Promise, 'function');
  eq('present:WeakMap', typeof WeakMap, 'function');
  eq('present:Proxy', typeof Proxy, 'function');
  eq('present:Symbol', typeof Symbol, 'function');
  eq('present:reportError', typeof reportError, 'function');
  eq('present:URL', typeof URL, 'function');
  eq('present:URLSearchParams', typeof URLSearchParams, 'function');

  // --- matchMedia: width queries vs the fixed 1280px viewport (§7) -----------
  // px and em/rem, the latter converting at 16px/unit (80em == 1280px).
  eq('mm:min1024px', matchMedia('(min-width: 1024px)').matches, true);
  eq('mm:max640px', matchMedia('(max-width: 640px)').matches, false);
  eq('mm:min80em', matchMedia('(min-width: 80em)').matches, true);
  eq('mm:min81em', matchMedia('(min-width: 81em)').matches, false);
  eq('mm:min40rem', matchMedia('(min-width: 40rem)').matches, true);
  eq('mm:featureless', matchMedia('print').matches, false);

  // --- Viewport + geometry widths (§7/§8) ------------------------------------
  eq('win:innerWidth', innerWidth, 1280);
  eq('win:innerHeight', innerHeight, 720);
  eq('win:outerWidth', outerWidth, 1280);
  var body = document.body;
  eq('geo:offsetWidth', body.offsetWidth, 1280);
  eq('geo:gbcr.width', body.getBoundingClientRect().width, 1280);
  // borderless/scrollbar-less model: content box == border box (§8).
  eq('geo:clientWidth==offsetWidth', body.clientWidth, body.offsetWidth);
  eq('geo:clientWidth', body.clientWidth, 1280);
  // documentElement reports the viewport itself (§8).
  eq('geo:documentElement.clientWidth', document.documentElement.clientWidth, 1280);
  eq('geo:documentElement.clientHeight', document.documentElement.clientHeight, 720);

  // --- history: in-memory, no navigation; does NOT mutate location (§7) ------
  eq('history:state.init', history.state, null);
  eq('history:length.init', history.length, 1);
  eq('history:scrollRestoration', history.scrollRestoration, 'auto');
  var pathBefore = location.pathname;
  history.pushState({ p: 1 }, '', '/pushed');
  eq('history:state.afterPush', history.state.p, 1);
  eq('history:length.afterPush', history.length, 2);
  history.replaceState({ p: 2 }, '', '/replaced');
  eq('history:state.afterReplace', history.state.p, 2);
  eq('history:length.afterReplace', history.length, 2);
  // location is a static fact — pushState left the honest path untouched (§7).
  eq('history:location.unchanged', location.pathname, pathBefore);

  // --- URL / URLSearchParams (§7) --------------------------------------------
  eq('url:searchParams.get', new URL('a?x=1', 'https://e.com/d/').searchParams.get('x'), '1');
  var invalid;
  try {
    new URL('not a url');
    invalid = 'no throw';
  } catch (e) {
    invalid = e.constructor.name;
  }
  eq('url:invalid.throws', invalid, 'TypeError');

  // --- Storage + cookie: real semantics, born empty (§7) ---------------------
  eq('storage:local.empty', localStorage.length, 0);
  eq('storage:session.empty', sessionStorage.length, 0);
  eq('storage:cookie.empty', document.cookie, '');

  // --- self/window/top/parent all point at the single global (§1 spike) ------
  check('identity:window==self==top==parent==globalThis',
    window === self && self === top && top === parent && window === globalThis);

  // --- Absent by design: `typeof` is 'undefined' so detection falls through --
  ['IntersectionObserver', 'MutationObserver', 'ResizeObserver', 'customElements',
    'MessageChannel', 'TextEncoder'].forEach(function (n) {
    eq('absent:' + n, typeof globalThis[n], 'undefined');
  });

  // --- DOM collections (§3, bl-e5c3): every query result is an instance of the
  // spec-named interface, and the interfaces are real globals a page can touch
  // (the field trial's bundle ran `NodeList.prototype.forEach = ...` and died on
  // an undefined NodeList).
  eq('coll:NodeList', typeof NodeList, 'function');
  eq('coll:HTMLCollection', typeof HTMLCollection, 'function');
  var qsa = document.querySelectorAll('div');
  check('coll:qsa.instanceof', qsa instanceof NodeList);
  check('coll:qsa.tag', Object.prototype.toString.call(qsa) === '[object NodeList]');
  eq('coll:qsa.length', qsa.length, 1);
  check('coll:qsa.item', qsa.item(0) === qsa[0] && qsa.item(1) === null);
  check('coll:childNodes.instanceof', document.body.childNodes instanceof NodeList);
  check('coll:children.instanceof', document.body.children instanceof HTMLCollection);
  check('coll:byTag.instanceof', document.getElementsByTagName('div') instanceof HTMLCollection);
  var byTag = document.getElementsByTagName('div');
  check('coll:namedItem', byTag.namedItem('probe') === byTag[0] && byTag.namedItem('absent') === null);
  // WebIDL value-iterator shape: the iteration methods ARE the Array ones, so
  // forEach/spread work on results and the constructors throw when new'd.
  check('coll:forEach==Array', NodeList.prototype.forEach === Array.prototype.forEach);
  var spread = [...qsa];
  check('coll:iterable', spread.length === 1 && spread[0] === qsa[0]);
  var illegal;
  try {
    new NodeList();
    illegal = 'no throw';
  } catch (e) {
    illegal = e.constructor.name;
  }
  eq('coll:illegalConstructor', illegal, 'TypeError');

  // --- DOMTokenList (§3, bl-3a36): every token list the DOM exposes is the
  // spec-named interface — classList and relList from one maker, live over the
  // backing attribute. The field trial's Vite preload polyfill dies without
  // link.relList.supports('modulepreload') early-returning true.
  eq('tok:DOMTokenList', typeof DOMTokenList, 'function');
  var probeEl = document.getElementById('probe');
  probeEl.setAttribute('class', 'one two');
  var cl = probeEl.classList;
  check('tok:classList.instanceof', cl instanceof DOMTokenList);
  check('tok:classList.tag', Object.prototype.toString.call(cl) === '[object DOMTokenList]');
  eq('tok:length', cl.length, 2);
  check('tok:indexed', cl[0] === 'one' && cl[1] === 'two' && cl[2] === undefined);
  check('tok:item', cl.item(1) === 'two' && cl.item(9) === null);
  eq('tok:value', cl.value, 'one two');
  check('tok:contains', cl.contains('two') && !cl.contains('three'));
  cl.add('three');
  cl.remove('one');
  check('tok:addRemove.live', probeEl.getAttribute('class') === 'two three');
  check('tok:toggle', cl.toggle('two') === false && cl.toggle('two') === true);
  check('tok:replace', cl.replace('three', 'four') === true && cl.contains('four'));
  check('tok:forEach==Array', DOMTokenList.prototype.forEach === Array.prototype.forEach);
  var clSpread = [...cl];
  check('tok:iterable', clSpread.join(',') === probeEl.getAttribute('class').split(' ').join(','));
  probeEl.setAttribute('class', '');
  var clThrow;
  try {
    cl.supports('anything');
    clThrow = 'no throw';
  } catch (e) {
    clThrow = e.constructor.name;
  }
  eq('tok:classList.supports.throws', clThrow, 'TypeError');
  var tokIllegal;
  try {
    new DOMTokenList();
    tokIllegal = 'no throw';
  } catch (e) {
    tokIllegal = e.constructor.name;
  }
  eq('tok:illegalConstructor', tokIllegal, 'TypeError');
  // relList: pinned Firefox 140esr supported-token tables (Gecko
  // HTMLLinkElement.cpp SUPPORTED_REL_VALUES_BASE + default-on manifest/
  // modulepreload; Element.cpp sAnchorAndFormRelValues), case-insensitive.
  var linkRel = document.createElement('link').relList;
  check('tok:link.relList.instanceof', linkRel instanceof DOMTokenList);
  check('tok:link.supports.modulepreload', linkRel.supports('modulepreload') === true);
  check('tok:link.supports.caseless', linkRel.supports('MODULEPRELOAD') === true);
  check('tok:link.supports.stylesheet', linkRel.supports('stylesheet') === true);
  check('tok:link.supports.unknown', linkRel.supports('bogus') === false);
  var aRel = document.createElement('a').relList;
  check('tok:a.supports.noopener', aRel.supports('noopener') === true);
  check('tok:a.supports.preload', aRel.supports('preload') === false);
  eq('tok:div.relList', document.createElement('div').relList, undefined);

  // --- Element/document breadth the modern-bundle field trial exercised
  // (bl-3a36): each of these was absent and killed a deployed React app inside
  // a library, not app code.
  // createElementNS: React/Vue create every SVG element through it; the arena
  // stores local names, so the namespace argument is honestly dropped.
  var svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  eq('elem:createElementNS.tag', svgEl.tagName, 'SVG');
  svgEl.setAttributeNS(null, 'viewBox', '0 0 1 1');
  eq('elem:setAttributeNS', svgEl.getAttributeNS(null, 'viewBox'), '0 0 1 1');
  svgEl.removeAttributeNS(null, 'viewBox');
  eq('elem:removeAttributeNS', svgEl.getAttribute('viewBox'), null);
  // getRootNode: no shadow DOM, so connected == document, detached == subtree top.
  check('elem:getRootNode.connected', document.body.getRootNode() === document);
  check('elem:getRootNode.detached', svgEl.getRootNode()._id === svgEl._id);
  // Sibling traversal + closest, live over the arena.
  var sibA = document.createElement('i');
  var sibB = document.createElement('b');
  document.body.appendChild(sibA);
  document.body.appendChild(sibB);
  check('elem:nextSibling', sibA.nextSibling._id === sibB._id && sibB.nextSibling === null);
  check('elem:previousSibling', sibB.previousSibling._id === sibA._id);
  sibA.setAttribute('class', 'sib-a');
  check('elem:closest', sibA.closest('.sib-a')._id === sibA._id
    && sibA.closest('body')._id === document.body._id && sibA.closest('.absent') === null);
  // ParentNode/ChildNode mixin: append takes nodes or strings; remove detaches.
  sibA.append(document.createElement('u'), 'tail');
  eq('elem:append', sibA.innerHTML, '<u></u>tail');
  sibA.prepend('head');
  eq('elem:prepend', sibA.textContent, 'headtail');
  sibB.remove();
  check('elem:remove', sibB.parentNode === null && sibA.nextSibling === null);
  sibA.remove();
  // Form-control interfaces carry the same reflection descriptors as the nodes
  // (Radix reads getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value').set
  // and calls it).
  var selDesc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
  var inDesc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'checked');
  check('elem:ctl.descriptors', !!(selDesc && selDesc.set && inDesc && inDesc.set));
  var ctlSel = document.createElement('select');
  selDesc.set.call(ctlSel, 'picked');
  eq('elem:ctl.set', ctlSel.getAttribute('value'), 'picked');
  // new DocumentFragment() is a real staging fragment (React portals into one
  // and checks nodeType and reaches the document through ownerDocument).
  var frag = new DocumentFragment();
  check('elem:fragment.real', frag.nodeType === 11 && frag instanceof DocumentFragment
    && frag.ownerDocument === document && frag.nodeName === '#document-fragment');
  var fragKid = document.createElement('span');
  frag.appendChild(fragKid);
  var fragKid2 = document.createElement('em');
  frag.insertBefore(fragKid2, fragKid);
  check('elem:fragment.insertBefore', frag.firstChild === fragKid2);
  frag.removeChild(fragKid2);
  check('elem:fragment.removeChild', frag.firstChild === fragKid && frag.childNodes.length === 1);

  // --- Focus (§7, bl-3a36): one fact — activeElement — that focus()/blur()
  // move, page-driven only (the host never focuses anything, §11). React's
  // commit phase runs `autoFocus && el.focus()` on mount; without this the
  // field trial's TodoMVC root unmounted with one "not a function" report.
  check('focus:activeElement.init', document.activeElement._id === document.body._id);
  var focusInput = document.createElement('input');
  document.body.appendChild(focusInput);
  var focusEvents = [];
  focusInput.addEventListener('focus', function () { focusEvents.push('focus'); });
  focusInput.addEventListener('blur', function () { focusEvents.push('blur'); });
  focusInput.focus();
  check('focus:activeElement.moved', document.activeElement._id === focusInput._id);
  var focusDiv = document.createElement('div');
  document.body.appendChild(focusDiv);
  focusDiv.focus(); // unfocusable: Firefox's silent no-op — activeElement holds
  check('focus:unfocusable.noop', document.activeElement._id === focusInput._id);
  focusInput.blur();
  check('focus:blur.restores', document.activeElement._id === document.body._id);
  eq('focus:events', focusEvents.join(','), 'focus,blur');
  var focusHidden = document.createElement('input');
  focusHidden.setAttribute('type', 'hidden');
  document.body.appendChild(focusHidden);
  focusHidden.focus();
  check('focus:hidden.noop', document.activeElement._id === document.body._id);
  focusDiv.setAttribute('tabindex', '0');
  focusDiv.focus(); // tabindex makes anything focusable
  check('focus:tabindex.focusable', document.activeElement._id === focusDiv._id);
  focusDiv.blur();
  document.body.removeChild(focusInput);
  document.body.removeChild(focusDiv);
  document.body.removeChild(focusHidden);

  // --- Lifecycle capture (§4.4/§5): readyState transitions + phase order -----
  RS.inline = document.readyState;      // 'loading' while the script queue runs
  RS.perf0 = performance.now();
  ORDER.push('inline');
  document.addEventListener('DOMContentLoaded', function () {
    RS.dcl = document.readyState;       // 'interactive' immediately before DCL
    ORDER.push('dcl');
  });
  window.addEventListener('load', function () {
    RS.load = document.readyState;      // 'complete' before load
    RS.perfLoad = performance.now();
    ORDER.push('load');
    // A timer scheduled after load fires under the virtual clock (§5): the clock
    // jumps to its due time, so performance.now advances by the delay.
    setTimeout(function () {
      RS.postload = document.readyState;
      RS.perfTimer = performance.now();
      ORDER.push('timer');
      // Self-check the lifecycle now that every phase has run.
      eq('life:readyState.inline', RS.inline, 'loading');
      eq('life:readyState.defer', RS.defer, 'loading');
      eq('life:readyState.dcl', RS.dcl, 'interactive');
      eq('life:readyState.load', RS.load, 'complete');
      eq('life:readyState.postload', RS.postload, 'complete');
      // scripts (incl. defer) before DCL, DCL before load, timer after load.
      eq('life:order', ORDER.join(','), 'inline,defer,dcl,load,timer');
      // Virtual clock advanced by the 5 ms timer delay.
      check('life:virtualClockAdvanced', RS.perfTimer - RS.perfLoad >= 5);
      // bl-e707: one coherent clock. timeOrigin is a positive wall-clock ms;
      // performance.now()/Date.now() derive from that one origin and one monotone
      // source, reduced to the profile's 1 ms precision.
      check('clock:timeOrigin', typeof performance.timeOrigin === 'number' && performance.timeOrigin > 0);
      check('clock:precision', performance.now() % 1 === 0);
      var _diff = (Date.now() - performance.timeOrigin) - performance.now();
      check('clock:coherent', _diff <= 1 && _diff >= -1);
      // Real elapsed accumulated across the whole run — never perpetual zero.
      check('clock:advancedFromStart', RS.perfTimer >= RS.perf0);
      // The one place the whole run's regressions surface, written last.
      document.documentElement.setAttribute('data-fail', JSON.stringify(FAILS));
      document.documentElement.setAttribute('data-done', '1');
    }, 5);
  });

  // reportError routes an unhandled window 'error' into js.errors (§10). Called
  // once, deliberately — the Rust gate asserts the run's errors count == 1, which
  // pins both the channel and that nothing else in the probe errored.
  reportError(new Error('frot-env-probe'));
</script>
<!-- A `defer` inline script still runs in the script queue, before DCL (§4.2):
     one source-order rule covers classic/defer/async. It shares the globals the
     first script declared (cross-script `var` visibility). -->
<script defer>
  RS.defer = document.readyState;       // still 'loading' — ran before DCL
  ORDER.push('defer');
</script>
</body>
</html>
