name: CI

# The gate, run by a machine. `make check` is the whole of it and nothing here
# restates a step: the Makefile is the build authority (AGENTS.md "The gate"),
# and this file only readies a runner for it. Two things ride beside the gate
# because a release needs them proven BEFORE anything is published:
#
#   * `make package` — `cargo package`, then the leak scan over the files
#     inside the built `.crate` (what the registry would serve, forever).
#   * `make posix-musl` — the stripped static-musl binary, size-gated and put
#     through the POSIX suite, then uploaded as a workflow artifact. The release
#     pipeline attaches THAT file to the GitHub Release; it never rebuilds.
on:
  # Deliberately NO push arm. A push to `main` still runs this workflow, once,
  # as the instance `release-plz.yml` CALLS inside its own run (`uses:
  # ./.github/workflows/ci.yml`; its release job `needs:` that instance). A push
  # arm here would run the same jobs twice per push. Consequence: this workflow
  # has no runs of its own on `main` — read `release-plz.yml`'s for that.
  pull_request:
  # The reusable entry point. Its placement is load-bearing: crates.io trusted
  # publishing REFUSES an OIDC token minted under a `workflow_run` trigger, so
  # a release gated by OBSERVING this workflow from a distance could never move
  # to trusted publishing. A CALLED workflow executes inside the caller's run.
  workflow_call:
  # How the release PR gets its checks. release-plz opens that PR with
  # `GITHUB_TOKEN`, and GitHub starts no `pull_request` run for an event that
  # token caused — the run is created in `action_required` and never gets a job
  # (frot PR #1 sat that way for 30 days, then expired red: "likely failed
  # because of a workflow file issue"). `workflow_dispatch` is the one event
  # that token may cause, so `release-plz.yml` dispatches this workflow on the
  # release branch, and the `verdict` job below puts the result on the PR.
  workflow_dispatch:

# CI reads the tree and writes nothing back. Every action is pinned to a full
# commit SHA with its tag in the trailing comment: a tag can be repointed.
permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Registry + build cache. rust-toolchain.toml pins the compiler, so the
      # first cargo invocation auto-installs it with its components.
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Same tooling install as local (`make setup`): cargo-llvm-cov.
      - name: Install dev tooling
        run: make setup

      # size -> leak-scan -> fmt-check -> lint -> posix -> cov. One definition
      # of green, shared with the pre-commit gate.
      - name: The gate (make check)
        run: make check

      - name: Package (build the .crate + leak scan of its contents)
        run: make package

  artifact:
    name: static-musl artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # musl-gcc backs the vendored C (quickjs via cc, zstd-sys). The musl
      # target itself is auto-installed from rust-toolchain.toml.
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Build, strip, the 5-15 MiB envelope, the POSIX suite against the
      # stripped binary — all in the Makefile.
      - name: Build and gate the shipped binary (make posix-musl)
        run: make posix-musl
      # Named for the target, because a Release asset called `frot` says
      # nothing about what it runs on.
      - name: Stage under the asset name
        run: cp target/x86_64-unknown-linux-musl/release/frot frot-x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frot-x86_64-unknown-linux-musl
          path: frot-x86_64-unknown-linux-musl
          if-no-files-found: error

  # A dispatched run judges the release PR's head commit, and GitHub leaves a
  # dispatched run's checks OFF the pull request: the commit's status rollup
  # stays empty and `gh pr checks` reports none (measured on PR #1). A commit
  # STATUS is always in the rollup, so the verdict is restated as one — the
  # same context the dispatching step set to `pending`. Dispatch-only: under
  # `pull_request` and `workflow_call` the jobs above are already the checks.
  verdict:
    name: report the verdict as a commit status
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [gates, artifact]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post the status
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ (needs.gates.result == 'success' && needs.artifact.result == 'success') && 'success' || 'failure' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" -f context="CI" \
            -f description="make check, make package, make posix-musl" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
