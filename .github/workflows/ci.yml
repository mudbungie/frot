name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Registry + build cache. rust-toolchain.toml pins the compiler, so the
      # first cargo invocation auto-installs 1.95.0 + components + musl target.
      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Same tooling install as local (`make setup`): cargo-llvm-cov.
      - name: Install dev tooling
        run: make setup

      - name: Format check
        run: cargo fmt --check

      # Delegates to the Makefile so the gate lives in one place.
      - name: Lint (clippy -D warnings)
        run: make lint

      # Delegates to `make cov` — the 100% lines+regions threshold has one home.
      - name: Coverage (100% lines + regions)
        run: make cov

      # Delegates to `make size` — scripts/source-files.sh owns which files are
      # source (Rust, the JS prelude, the gate shell; never tests/fixtures,
      # which is data) and scripts/line-limit.sh owns the 300. Neither the set
      # nor the number is duplicated here, so this and `make check`
      # cannot drift apart the way they did in bl-6da7.
      - name: Source-file line limit
        run: make size

      # Delegates to `make posix` — the /bin/sh conformance harness gating the
      # CLI contract (docs/design/posix.md) at the process boundary: argv,
      # streams, exit statuses, signals, lifecycle. The shipped musl artifact
      # gets the same suite in the release pipeline (release-plz.yml).
      - name: POSIX conformance suite
        run: make posix

      # Delegates to `make package` (cargo publish --dry-run --locked) so the
      # crates.io packaging can never silently rot. Dry run only — the real
      # `cargo publish` belongs to the release workflow, which runs it when the
      # release PR is merged (release-plz.yml, `release-plz release` job).
      - name: Package (crates.io dry run)
        run: make package
